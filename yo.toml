[package]
name = "markdown_yo"
version = "0.0.6"
description = "A Markdown parser and renderer written in Yo"
license = "MIT"

[modules]
# `import("markdown_yo")` — the module root moved here from `build.module`,
# which no longer takes a `root`. This is what the Yo compiler itself imports
# for `yo doc --format html`.
default = "src/lib.yo"

