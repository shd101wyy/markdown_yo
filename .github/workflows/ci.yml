name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Yo compiler
        run: |
          curl -sSL https://shd101wyy.github.io/Yo/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Format check
        run: yo fmt --check ./src ./tests ./build.yo

      - name: Install JS test dependencies
        run: npm install

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: "4.0.12"

      - name: Build
        run: |
          yo build
          yo build wasm_exe

      - name: Unit tests
        run: yo test ./tests --parallel 1

      - name: Fixture tests & benchmark
        run: |
          node scripts/run_fixture_tests.js
          node benchmark/generate_samples.js
          node benchmark/run.js
